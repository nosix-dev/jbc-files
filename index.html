<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Téléchargement de fichiers J.B.C</title>
    
    <link rel="icon" type="image/png" href="photos/logo.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #000000;
            background-image: 
                radial-gradient(circle at 15% 25%, rgba(120, 120, 120, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 85% 75%, rgba(80, 80, 80, 0.3) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(150, 150, 150, 0.1) 0%, transparent 60%),
                radial-gradient(circle at 90% 10%, rgba(100, 100, 100, 0.2) 0%, transparent 35%),
                radial-gradient(circle at 10% 90%, rgba(180, 180, 180, 0.15) 0%, transparent 40%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border-radius: 24px;
            padding: 45px 40px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 
                0 25px 70px rgba(0, 0, 0, 0.7),
                0 0 40px rgba(255, 255, 255, 0.03),
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                inset 0 -1px 0 rgba(255, 255, 255, 0.05);
            max-width: 800px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
        }

        .header-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
            animation: fadeIn 0.8s ease;
        }

        .header-logo img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.3));
            transition: all 0.3s ease;
        }

        .header-logo img:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.5));
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #ffffff;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2em;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.1);
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 35px;
            font-size: 0.95em;
        }

        .download-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .download-grid .centered {
            grid-column: 1 / -1;
            max-width: 385px;
            width: 100%;
            margin: 0 auto;
        }

        .download-btn {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 18px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            cursor: pointer;
            text-decoration: none;
            color: #ffffff;
            transition: all 0.35s ease;
            font-size: 1em;
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 4px 15px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .download-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            transition: left 0.7s ease;
            z-index: 1;
        }

        .download-btn:hover::before {
            left: 100%;
        }

        .download-btn::after {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            opacity: 0.6;
        }

        .download-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-4px);
            box-shadow: 
                0 15px 40px rgba(0, 0, 0, 0.5),
                0 0 30px rgba(255, 255, 255, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .download-btn:active {
            transform: translateY(-1px);
        }

        .icon {
            flex-shrink: 0;
            width: 70px;
            height: 70px;
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 
                inset 0 1px 0 rgba(255, 255, 255, 0.1),
                0 2px 8px rgba(0, 0, 0, 0.3);
            position: relative;
            z-index: 2;
        }

        .icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            filter: grayscale(100%) contrast(1.1) brightness(1.1);
            transition: filter 0.3s ease, transform 0.3s ease;
        }

        .download-btn:hover .icon {
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 
                0 0 20px rgba(255, 255, 255, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .download-btn:hover .icon img {
            transform: scale(1.1);
            filter: grayscale(0%) contrast(1.1);
        }

        .file-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            overflow: hidden;
            position: relative;
            z-index: 2;
        }

        .file-title {
            font-weight: 700;
            font-size: 1.05em;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.3s ease;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
        }

        .download-btn:hover .file-title {
            color: #ffffff;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
        }

        .file-name {
            font-weight: 500;
            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.55);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color 0.3s ease;
        }

        .download-btn:hover .file-name {
            color: rgba(255, 255, 255, 0.85);
        }

        .arrow {
            flex-shrink: 0;
            opacity: 0.4;
            color: #ffffff;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }

        .download-btn:hover .arrow {
            opacity: 1;
            transform: translateX(4px);
            filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.5));
        }

        .footer {
            text-align: center;
            margin-top: 35px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.85em;
            letter-spacing: 0.5px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            margin: 30px 0 25px 0;
        }

        @media (max-width: 700px) {
            .download-grid {
                grid-template-columns: 1fr;
            }
            .download-grid .centered {
                max-width: 100%;
            }
        }

        @media (max-width: 500px) {
            .container {
                padding: 30px 20px;
                border-radius: 20px;
            }
            .header-logo img {
                width: 70px;
                height: 70px;
            }
            h1 {
                font-size: 1.5em;
            }
            .download-btn {
                padding: 12px;
                gap: 10px;
                border-radius: 14px;
            }
            .icon {
                width: 55px;
                height: 55px;
                border-radius: 12px;
            }
            .file-title {
                font-size: 0.95em;
            }
        }

        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 5px;
            border: 2px solid #000000;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        ::selection {
            background: rgba(255, 255, 255, 0.9);
            color: #000000;
        }
    </style>
</head>
